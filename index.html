<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1f63ad" />
    <meta
      name="description"
      content="BFF Sample Testing — sample registration, testing and quality records for the Bounty Farm Limited Feed Factory."
    />
    <!-- Online-only MVP: no service worker is registered, deliberately. A cache
         layer here could serve a stale quality decision as current, which PRD
         NFR-006 and FR-015 forbid. Offline capture is FR-021, out of scope. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>BFF Sample Testing</title>
    <!--
      Canonical host.

      The app moved from GitHub Pages' own URL to bountyfarmltd.com/FeedQualityApp/,
      which is where the Cloudflare Worker serves it. Pages is still the origin
      and still answers on <owner>.github.io/<repo>/, but a build made for the
      new base references /FeedQualityApp/assets/..., which does not exist on
      github.io — so that URL would load a blank page rather than fail loudly.

      Anyone arriving on an old bookmark is sent to the canonical URL instead,
      carrying their hash route with them. Scoped to *.github.io ONLY: localhost
      and the canonical host must never redirect, and neither must the CI
      preview server, which serves this same HTML from 127.0.0.1.
    -->
    <script>
      (function () {
        if (location.hostname.endsWith('.github.io')) {
          location.replace('https://bountyfarmltd.com/FeedQualityApp/' + location.hash);
        }
      })();
    </script>
  </head>
  <body class="bg-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
